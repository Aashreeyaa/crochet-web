<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>eSewa Payment</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-body">

                    <h3 class="text-center mb-4">
                        eSewa Payment
                    </h3>

                    <div class="mb-3">
                        <strong>Order:</strong>
                        {{ order.order_number }}
                    </div>

                    <div class="mb-4">
                        <strong>Amount:</strong>
                        Rs. {{ total_amount }}
                    </div>

                    <form
                        action="{{ payment_url }}"
                        method="POST"
                    >

                        <input
                            type="hidden"
                            name="amount"
                            value="{{ amount }}"
                        >

                        <input
                            type="hidden"
                            name="tax_amount"
                            value="0"
                        >

                        <input
                            type="hidden"
                            name="total_amount"
                            value="{{ total_amount }}"
                        >

                        <input
                            type="hidden"
                            name="transaction_uuid"
                            value="{{ transaction_uuid }}"
                        >

                        <input
                            type="hidden"
                            name="product_code"
                            value="{{ product_code }}"
                        >

                        <input
                            type="hidden"
                            name="product_service_charge"
                            value="0"
                        >

                        <input
                            type="hidden"
                            name="product_delivery_charge"
                            value="0"
                        >

                        <input
                            type="hidden"
                            name="success_url"
                            value="{{ success_url }}"
                        >

                        <input
                            type="hidden"
                            name="failure_url"
                            value="{{ failure_url }}"
                        >

                        <input
                            type="hidden"
                            name="signed_field_names"
                            value="total_amount,transaction_uuid,product_code"
                        >

                        <input
                            type="hidden"
                            name="signature"
                            value="{{ signature }}"
                        >

                        <button
                            type="submit"
                            class="btn btn-success w-100"
                        >
                            Pay with eSewa
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
